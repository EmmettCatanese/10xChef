<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10x Chef — plan meals, shop once</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="appbar">
  <div class="appbar-in">
    <div class="brand">10x Chef<span class="dot"></span><small>plan meals · shop once</small></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="plan" aria-selected="true">This week <span class="badge" id="tab-recipes">0</span></button>
      <button class="tab" role="tab" data-view="list" aria-selected="false">List <span class="badge" id="tab-list">0</span></button>
    </div>
  </div>
</div>

<main>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-list" hidden></section>
</main>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="cook-overlay" id="cook"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
